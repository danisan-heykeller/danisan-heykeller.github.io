<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>Əliağa Vahid · Danışan heykəllər</title>
<meta name="description" content="Əliağa Vahid sizə zəng edir. Danışan heykəllər, Bakı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600&family=Noto+Serif+Display:ital,wght@0,500;1,400&family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="vahid" data-root="../" class="s-ring">
<div class="bg placeholder" id="bg"></div><div class="veil"></div>
<div class="wrap">
  <div class="top"><a class="brand" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="width:14px;height:14px;vertical-align:-2px;margin-right:6px"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Danışan heykəllər · Bakı</a><div class="langs" role="group" aria-label="Dil / Язык"><button type="button" id="lang-az">AZ</button><button type="button" id="lang-ru">RU</button></div></div>

  <section class="ring-view" id="ringView">
    <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="statusTxt"></span></div>
    <h1 class="name" id="name"></h1>
    <div class="role" id="role"></div>
    <div class="meta">
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="dur"></span></span>
      <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg><span id="sound"></span></span>
    </div>
    <div class="actions">
      <div class="act"><button class="round decline" id="decline" type="button" aria-labelledby="declineLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.3c0 .7.7 1.2 1.4 1l3-1c.5-.2.8-.6.8-1.1v-1.6c2-.7 4.2-.7 6.2 0v1.6c0 .5.3.9.8 1.1l3 1c.7.2 1.4-.3 1.4-1v-2.3c0-.7-.4-1.3-1-1.6C17.1 9.6 14.6 9 12 9z"/></svg></button><span id="declineLbl"></span></div>
      <div class="act"><button class="round accept" id="accept" type="button" aria-labelledby="acceptLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></button><span id="acceptLbl"></span></div>
    </div>
    <button class="linkbtn" id="readRing" type="button"></button>
    <div class="credit" id="credit"></div>
  </section>

  <section class="declined-view" id="declinedView" hidden>
    <div class="status"><span id="declinedTxt"></span></div>
    <button class="btn primary" id="callBack" type="button"></button>
    <div class="row"><button class="btn" id="readDecl" type="button"></button><a class="btn" id="homeDecl" href="../"></a></div>
  </section>

  <section class="talk-view" id="talkView" hidden>
    <div class="talk-head"><span class="nm" id="talkName"></span><span class="time" id="time">0:00</span></div>
    <div class="prog"><i id="prog"></i></div>
    <div class="subs" id="subs"></div>
    <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="actions">
      <div class="act"><button class="round decline" id="hangup" type="button" aria-labelledby="hangLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.3c0 .7.7 1.2 1.4 1l3-1c.5-.2.8-.6.8-1.1v-1.6c2-.7 4.2-.7 6.2 0v1.6c0 .5.3.9.8 1.1l3 1c.7.2 1.4-.3 1.4-1v-2.3c0-.7-.4-1.3-1-1.6C17.1 9.6 14.6 9 12 9z"/></svg></button><span id="hangLbl"></span></div>
    </div>
  </section>

  <section class="done-view" id="done" hidden>
    <p class="count" id="thanks" style="margin:0"></p>
    <div class="card">
      <p class="eyebrow" id="deckEyebrow"></p>
      <p class="count" id="count"></p>
      <div class="deck" id="deck"></div>
      <p class="note" id="hint" style="text-align:left;margin:14px 0 0"></p>
    </div>
    <button class="btn primary" type="button" id="story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 15l3-3 5 5"/><circle cx="15" cy="8" r="1.5"/></svg><span id="storyLbl"></span></button>
    <div class="row">
      <button class="btn" type="button" id="again"></button>
      <button class="btn" type="button" id="share"></button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="row"><button class="btn" id="readDone" type="button"></button><a class="btn" id="homeLink" href="../"></a></div>
    <p class="note" id="foot"></p>
    <p class="note" id="ai"></p>
  </section>
</div>

<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rdName">
  <div class="reader-in">
    <div class="reader-top"><b id="rdName"></b><button class="btn" id="rdClose" type="button"></button></div>
    <div id="rdBody"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="">
  <p id="sheetTxt"></p>
  <button class="btn primary" id="sheetClose" type="button"></button>
</div>
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
