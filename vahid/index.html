<!doctype html>
<html lang="az" data-theme="pesnya">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>Əliağa Vahid · Danışan heykəllər</title>
<meta name="description" content="Əliağa Vahid sizə zəng edir. Danışan heykəllər, Bakı.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="vahid" data-root="../" class="call s-ring">
<div class="bg placeholder" id="bg"></div><div class="veil"></div>
<div class="wrap">
  <div class="top"><a class="brand" href="../">Danışan heykəllər</a><div class="top-r"><button class="whatbtn" id="whatBtn" type="button" aria-label="?">?</button><div class="langs" role="group" aria-label="Dil / Язык"><button type="button" id="lang-az">AZ</button><button type="button" id="lang-ru">RU</button></div></div></div>

  <section class="ring-view" id="ringView">
    <div class="status" aria-live="polite"><span class="dot"></span><span id="statusTxt"></span></div>
    <h1 class="name" id="name"></h1>
    <div class="role" id="role"></div>
    <div class="meta"><span class="chip" id="dur"></span><span class="chip" id="sound"></span></div>
    <div class="actions">
      <div class="act"><button class="round decline" id="decline" type="button" aria-labelledby="declineLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.3c0 .7.7 1.2 1.4 1l3-1c.5-.2.8-.6.8-1.1v-1.6c2-.7 4.2-.7 6.2 0v1.6c0 .5.3.9.8 1.1l3 1c.7.2 1.4-.3 1.4-1v-2.3c0-.7-.4-1.3-1-1.6C17.1 9.6 14.6 9 12 9z"/></svg></button><span id="declineLbl"></span></div>
      <div class="act"><button class="round accept" id="accept" type="button" aria-labelledby="acceptLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></button><span id="acceptLbl"></span></div>
    </div>
    <div class="credit" id="credit"></div>
  </section>

  <section class="declined-view" id="declinedView" hidden>
    <p class="big" id="declinedTxt"></p>
    <p class="sub" id="declinedSub"></p>
    <div class="row"><button class="btn primary" id="callBack" type="button"></button><button class="btn" id="readBtn" type="button"></button></div>
  </section>

  <section class="talk-view" id="talkView" hidden>
    <div class="talk-head"><span class="nm" id="talkName"></span><span class="time" id="time">0:00</span></div>
    <div class="prog"><i id="prog"></i></div>
    <div class="subs" id="subs" hidden></div>
    <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="talk-ctl">
      <button class="linkbtn" id="textToggle" type="button"></button>
      <div class="actions">
        <div class="act"><button class="round ghost" id="pause" type="button" aria-labelledby="pauseLbl"><span class="i-pause"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect id="pz1" x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></span><span class="i-play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg></span></button><span id="pauseLbl"></span></div>
        <div class="act"><button class="round decline" id="hangup" type="button" aria-labelledby="hangLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.3c0 .7.7 1.2 1.4 1l3-1c.5-.2.8-.6.8-1.1v-1.6c2-.7 4.2-.7 6.2 0v1.6c0 .5.3.9.8 1.1l3 1c.7.2 1.4-.3 1.4-1v-2.3c0-.7-.4-1.3-1-1.6C17.1 9.6 14.6 9 12 9z"/></svg></button><span id="hangLbl"></span></div>
      </div>
    </div>
  </section>

  <section class="read-view" id="readView" hidden>
    <div class="talk-head"><span class="nm" id="readName"></span><span class="time" id="readPos"></span></div>
    <div class="page" id="page" aria-live="polite"></div>
    <div class="row"><button class="btn" id="readBack" type="button"></button><button class="btn primary" id="readNext" type="button"></button></div>
  </section>

  <section class="done-view" id="done" hidden>
    <p class="eyebrow" id="valueLbl"></p>
    <blockquote class="proverb" id="proverb"></blockquote>
    <p class="sub" id="thanks"></p>
    <button class="btn primary" type="button" id="story"><span id="storyLbl"></span></button>
    <div class="row"><button class="btn" type="button" id="again"></button><button class="btn" type="button" id="share"></button></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="card">
      <p class="eyebrow" id="othersLbl"></p>
      <div class="others" id="others"></div>
    </div>
    <a class="btn" id="homeLink" href="../"></a>
    <p class="note" id="ai"></p>
  </section>
</div>

<aside class="side-qr" aria-hidden="true"><img src="../qr/vahid.svg" alt="" width="132" height="132"><p id="qrTxt"></p></aside>

<div class="sheet small" id="what" hidden role="dialog" aria-modal="true" aria-labelledby="whatTitle">
  <div class="what-in"><b id="whatTitle"></b><p id="whatText"></p><div class="row"><a class="btn" id="whatHome" href="../"></a><button class="btn primary" id="whatClose" type="button"></button></div></div>
</div>
<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="">
  <p id="sheetTxt"></p>
  <button class="btn primary" id="sheetClose" type="button"></button>
</div>
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
