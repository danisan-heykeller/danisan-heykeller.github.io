<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,500;1,400;1,500&family=Golos+Text:wght@400;500;600&display=swap">
<title>Əliağa Vahid · Danışan heykəllər</title>
<meta name="description" content="Əliağa Vahid sizə zəng edir. Danışan heykəllər, Bakı.">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="vahid" data-root="../">
<div class="wrap">
  <div class="top"><a class="brand" href="../">Danışan heykəllər · Bakı</a><div class="langs" role="group" aria-label="Dil / Язык"><button type="button" id="lang-az">AZ</button><button type="button" id="lang-ru">RU</button></div></div>

  <section class="caller ringing" id="caller">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="portrait" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <div class="face" id="initial"></div>
    </div>
    <h1 id="name"></h1>
    <div class="role" id="role"></div>
    <div class="place" id="place"></div>
    <div class="wave" id="wave" hidden><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </section>

  <div class="subs" id="subs" hidden></div>

  <div class="actions" id="ringActions">
    <div class="act"><button class="round decline" id="decline" type="button" aria-labelledby="declineLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.3c0 .7.7 1.2 1.4 1l3-1c.5-.2.8-.6.8-1.1v-1.6c2-.7 4.2-.7 6.2 0v1.6c0 .5.3.9.8 1.1l3 1c.7.2 1.4-.3 1.4-1v-2.3c0-.7-.4-1.3-1-1.6C17.1 9.6 14.6 9 12 9z"/></svg></button><span id="declineLbl"></span></div>
    <div class="act"><button class="round accept" id="accept" type="button" aria-labelledby="acceptLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></button><span id="acceptLbl"></span></div>
  </div>
  <div class="actions" id="declinedActions" hidden>
    <button class="btn primary" id="callBack" type="button"></button>
  </div>
  <div class="actions" id="callActions" hidden>
    <div class="act"><button class="round decline" id="hangup" type="button" aria-labelledby="hangLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.3c0 .7.7 1.2 1.4 1l3-1c.5-.2.8-.6.8-1.1v-1.6c2-.7 4.2-.7 6.2 0v1.6c0 .5.3.9.8 1.1l3 1c.7.2 1.4-.3 1.4-1v-2.3c0-.7-.4-1.3-1-1.6C17.1 9.6 14.6 9 12 9z"/></svg></button><span id="hangLbl"></span></div>
  </div>

  <section id="done" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <p class="eyebrow" id="deckEyebrow"></p>
      <p class="count" id="count"></p>
      <div class="deck" id="deck"></div>
      <p class="note" id="hint" style="text-align:left;margin:14px 0 0"></p>
    </div>
    <div class="row">
      <button class="btn primary" type="button" id="again"></button>
      <button class="btn" type="button" id="share"></button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <details class="transcript card"><summary id="trSum"></summary><div id="trBody"></div></details>
    <a class="btn" id="homeLink" href="../"></a>
  </section>

  <p class="note" id="foot"></p>
</div>
<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
