<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600&family=Noto+Serif+Display:ital,wght@0,500;1,400&family=Golos+Text:wght@400;500;600;700&display=swap">
<title>İçərişəhər · Metro pasportu</title>
<meta name="description" content="İçərişəhər stansiyasının möhürü - Metro pasportu, Bakı.">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body data-page="icherisheher" data-root="../../" class="station-page">
<div class="bg placeholder metro-bg"></div><div class="veil"></div>
<div class="wrap">
  <div class="top"><a class="brand" id="brand" href="../../metro/"></a><div class="langs" role="group" aria-label="Dil / Язык"><button type="button" id="lang-az">AZ</button><button type="button" id="lang-ru">RU</button></div></div>
  <section class="st-head">
    <p class="st-line" id="lineName"></p>
    <h1 class="name" id="name"></h1>
    <div class="role" id="role"></div>
  </section>
  <div class="stamp-wrap">
    <div id="stampArt" class="stamp-art off"></div>
    <p class="stamp-msg" id="stampMsg" aria-live="polite"></p>
  </div>
  <div class="card" id="earn">
    <p class="eyebrow" id="modeLbl"></p>
    <div class="seg" role="group"><button type="button" id="m-quiz"></button><button type="button" id="m-honor"></button><button type="button" id="m-qr"></button></div>
    <p class="mode-hint" id="modeHint"></p>
    <div id="quiz"><p class="q" id="qText"></p><div class="opts" id="qOpts"></div><p class="qmsg" id="qMsg" aria-live="polite"></p></div>
    <div id="honor" hidden><button class="btn primary" type="button" id="honorBtn"></button></div>
    <div id="qr" hidden><p class="q" id="qrNeed"></p><p class="mode-hint" id="qrDemo"></p><img class="qr-demo" id="qrImg" alt="QR"></div>
  </div>
  <div class="card">
    <p class="eyebrow" id="storyTitle"></p>
    <p class="story" id="story"></p>
  </div>
  <div class="card look" id="look" hidden>
    <p class="eyebrow" id="lookTitle"></p>
    <ul class="looklist" id="lookList"></ul>
  </div>
  <a class="btn primary" id="toPassport" href="../../metro/"></a>
  <button class="linkbtn" type="button" id="reset" hidden></button>
  <p class="note" id="foot"></p>
</div>
<script src="../../assets/metro.js"></script>
<script src="../../assets/passport.js"></script>
</body>
</html>
