<!doctype html>
<html lang="az" data-theme="pravda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ebdd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">
<title>Danışan heykəllər</title>
<meta name="description" content="Bakının heykəlləri danışır. QR kodu skan edin - abidə sizə zəng edəcək.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home" data-root="./" class="home">
<div class="bg placeholder"></div><div class="veil"></div>
<div class="wrap">
  <div class="top"><a class="brand" href="./">Danışan heykəllər · Bakı</a><div class="langs" role="group" aria-label="Dil / Язык"><button type="button" id="lang-az">AZ</button><button type="button" id="lang-ru">RU</button></div></div>
  <section class="hero">
    <div class="hero-text">
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroLead"></p>
    </div>
    <div class="strip" aria-hidden="true">
      <span style="background-image:url('photo/vahid.jpg')"></span>
      <span style="background-image:url('photo/sabir.jpg')"></span>
      <span style="background-image:url('photo/natavan.jpg')"></span>
    </div>
  </section>
  <div class="cols">
    <div class="card">
      <p class="eyebrow" id="howTitle"></p>
      <ol class="steps" id="how"></ol>
    </div>
    <div class="card">
      <p class="eyebrow" id="aboutTitle"></p>
      <p class="about" id="aboutText"></p>
    </div>
  </div>
  <div class="card">
    <p class="eyebrow" id="deckEyebrow"></p>
    <p class="count" id="count"></p>
    <div class="deck" id="deck"></div>
  </div>
  <footer class="foot">
    <div class="endorse"><img src="assets/brand/gokand-mark.svg" alt="" width="44" height="47"><span><b id="endorse"></b><span id="author"></span></span></div>
    <p class="note" id="foot"></p>
    <p class="note" id="ai"></p>
  </footer>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
