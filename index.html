<!doctype html>
<html lang="az" data-theme="pravda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>Danışan heykəllər</title>
<meta name="description" content="Bakının heykəlləri danışır. QR kodu skan edin - abidə sizə zəng edəcək.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css?v=art2">
</head>
<body data-page="home" data-root="./" class="home">

<section class="stage" data-theme="pesnya" id="stage">
  <div class="stage-in">
    <div class="stage-top"><span class="brand">Danışan heykəllər · Bakı</span><div class="langs" role="group" aria-label="Dil / Язык"><button type="button" id="lang-az">AZ</button><button type="button" id="lang-ru">RU</button></div></div>
    <div class="stage-main">
      <p class="eyebrow" id="stageEyebrow"></p>
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroLead"></p>
      <div class="stage-panel">
        <ol class="steps" id="how"></ol>
        <p class="about" id="aboutText"></p>
        <a class="btn primary" id="toHeroes" href="#heroesBlock"></a>
      </div>
    </div>
  </div>
  <div class="kayma" aria-hidden="true"></div>
</section>

<div class="wrap">
  <section class="block" id="heroesBlock">
    <p class="eyebrow" id="heroesTitle"></p>
    <div class="heroes" id="heroes"></div>
  </section>

  <footer class="foot">
    <div class="endorse"><img src="assets/brand/gokand-mark.svg" alt="" width="44" height="47"><span><b id="endorse"></b><span id="author"></span></span></div>
    <p class="note" id="foot"></p>
    <p class="note" id="ai"></p>
  </footer>
</div>
<script src="assets/data.js?v=art2"></script>
<script src="assets/app.js?v=art2"></script>
</body>
</html>
