<!doctype html>
<html lang="az" data-theme="pravda">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<title>Danışan heykəllər</title>
<meta name="description" content="Bakının heykəlləri danışır. QR kodu skan edin - abidə sizə zəng edəcək.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home" data-root="./" class="home">

<section class="stage" data-theme="pesnya" id="stage">
  <div class="faces" id="faces"></div>
  <div class="stage-veil"></div>
  <div class="stage-in">
    <div class="stage-top"><span class="brand">Danışan heykəllər · Bakı</span><div class="langs" role="group" aria-label="Dil / Язык"><button type="button" id="lang-az">AZ</button><button type="button" id="lang-ru">RU</button></div></div>
    <div class="stage-main">
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroLead"></p>
      <div class="incoming" id="incoming">
        <div class="inc-text">
          <span class="status"><span class="dot"></span><span id="incStatus"></span></span>
          <a class="inc-name" id="incName" href="#"></a>
          <span class="inc-role" id="incRole"></span>
        </div>
        <div class="inc-btns">
          <button class="round decline sm" id="incNext" type="button" aria-labelledby="incNextLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-2.6 0-5.1.6-7.3 1.7-.6.3-1 .9-1 1.6v2.3c0 .7.7 1.2 1.4 1l3-1c.5-.2.8-.6.8-1.1v-1.6c2-.7 4.2-.7 6.2 0v1.6c0 .5.3.9.8 1.1l3 1c.7.2 1.4-.3 1.4-1v-2.3c0-.7-.4-1.3-1-1.6C17.1 9.6 14.6 9 12 9z"/></svg></button>
          <a class="round accept sm" id="incAccept" href="#" aria-labelledby="incAcceptLbl"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></a>
          <span class="sr" id="incNextLbl"></span><span class="sr" id="incAcceptLbl"></span>
        </div>
      </div>
    </div>
    <div class="wave stage-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</section>

<div class="wrap">
  <section class="block">
    <p class="eyebrow" id="heroesTitle"></p>
    <div class="heroes" id="heroes"></div>
  </section>

  <div class="cols">
    <div class="card">
      <p class="eyebrow" id="howTitle"></p>
      <ol class="steps" id="how"></ol>
    </div>
    <div class="card">
      <p class="eyebrow" id="aboutTitle"></p>
      <p class="about" id="aboutText"></p>
    </div>
  </div>

  <footer class="foot">
    <div class="endorse"><img src="assets/brand/gokand-mark.svg" alt="" width="44" height="47"><span><b id="endorse"></b><span id="author"></span></span></div>
    <p class="note" id="foot"></p>
    <p class="note" id="ai"></p>
  </footer>
</div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
